<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Dashboard</title><style>
body{margin:0;font-family:system-ui;background:#f5f2ee;color:#2c211c}.top{background:#30241e;color:white;padding:22px 7%;display:flex;justify-content:space-between}.wrap{padding:30px 7%;max-width:1100px;margin:auto}.card{background:white;padding:22px;border-radius:16px;box-shadow:0 6px 22px #0001;margin:15px 0}input{width:100%;padding:12px;margin:7px 0 13px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box}.btn{border:0;border-radius:22px;padding:11px 17px;font-weight:800;cursor:pointer;margin:4px}.ok{background:#cfe8d0}.bad{background:#eccaca}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:white;padding:18px;border-radius:14px;min-width:130px}.table{background:white;border-radius:16px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:14px;text-align:left;border-bottom:1px solid #eee}.hidden{display:none}.copy{font-family:monospace;background:#f1eee9;padding:8px;border-radius:7px}
</style></head><body><div class="top"><b>☕ Café Owner Dashboard</b><span id="who"></span></div><div class="wrap">
<div id="auth" class="card"><h2>Owner account</h2><input id="cafe" placeholder="Café name"><input id="ownerName" placeholder="Your name"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="btn" onclick="signup()">Create Account</button><hr><input id="lemail" type="email" placeholder="Existing email"><input id="lpass" type="password" placeholder="Password"><button class="btn" onclick="login()">Login</button><p id="authMsg"></p></div>
<div id="dash" class="hidden"><div class="card"><h2 id="cafeTitle"></h2><p>Your café booking ID: <span class="copy" id="ownerId"></span> <button class="btn" onclick="copyId()">Copy</button></p><p>Give this ID to the booking page or use it later to create a café-specific QR/link.</p><button class="btn" onclick="logout()">Log out</button></div>
<div class="stats" id="stats"></div><div class="card"><button class="btn" onclick="load()">↻ Refresh reservations</button><span id="newAlert"></span></div>
<div class="table"><table><thead><tr><th>Customer</th><th>Phone</th><th>Date</th><th>Time</th><th>Guests</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<script>
let token=localStorage.getItem("bbtoken"),me=null,lastCount=0;
async function api(url,opt={}){opt.headers=Object.assign({"Content-Type":"application/json"},opt.headers||{});if(token)opt.headers.Authorization="Bearer "+token;return fetch(url,opt)}
async function signup(){let r=await api("/api/signup",{method:"POST",body:JSON.stringify({cafe:cafe.value,ownerName:ownerName.value,email:email.value,password:password.value})}),j=await r.json();if(!r.ok)return authMsg.textContent=j.error;token=j.token;localStorage.setItem("bbtoken",token);show(j.owner)}
async function login(){let r=await api("/api/login",{method:"POST",body:JSON.stringify({email:lemail.value,password:lpass.value})}),j=await r.json();if(!r.ok)return authMsg.textContent=j.error;token=j.token;localStorage.setItem("bbtoken",token);show(j.owner)}
async function show(o){me=o;auth.classList.add("hidden");dash.classList.remove("hidden");cafeTitle.textContent="☕ "+o.cafe;who.textContent=o.ownerName;ownerId.textContent=o.id;await load()}
async function load(){let r=await api("/api/bookings"),a=await r.json();if(!r.ok)return logout();if(a.length>lastCount&&lastCount!==0)newAlert.textContent=" 🔔 New reservation received!";lastCount=a.length;stats.innerHTML=["All","Pending","Confirmed","Cancelled"].map(s=>`<div class="stat"><b>${s}</b><br><strong style="font-size:25px">${s==="All"?a.length:a.filter(x=>x.status===s).length}</strong></div>`).join("");rows.innerHTML=a.map(b=>`<tr><td><b>${esc(b.name)}</b></td><td>${esc(b.phone)}</td><td>${b.date}</td><td>${b.time}</td><td>${b.guests}</td><td>${b.status}</td><td><button class="btn ok" onclick="setStatus('${b.id}','Confirmed')">Confirm</button><button class="btn bad" onclick="setStatus('${b.id}','Cancelled')">Cancel</button></td></tr>`).join("")||"<tr><td colspan=7>No reservations yet.</td></tr>"}
async function setStatus(id,status){await api("/api/bookings/"+id,{method:"PATCH",body:JSON.stringify({status})});load()}
function logout(){token=null;localStorage.removeItem("bbtoken");location.reload()}
function copyId(){navigator.clipboard?.writeText(me.id)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
if(token)api("/api/me").then(r=>r.json()).then(o=>{if(o.id)show(o);else logout()});setInterval(()=>{if(token)load()},15000)
</script></body></html>
